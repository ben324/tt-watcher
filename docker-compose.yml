services:
  internal:
    build: { context: ., target: internal }
    ports: ["8081:8081"]
    mem_limit: 256m
    environment:
      INTERNAL_PORT: "8081"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal}
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx160m -XX:+UseSerialGC"
  api:
    build: { context: ., target: api }
    image: tt-watcher-api
    ports: ["8080:8080"]
    mem_limit: 256m
    env_file: [.env]
    environment:
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx160m -XX:+UseSerialGC"
      PORT: "8080"
      INTERNAL_BASE_URL: http://internal:8081
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal}
      RIFTBOUND_STORE: /app/data/store.json
      TT_WATCHER_DIR: /app/tt-watcher
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes: ["./data:/app/data"]
    depends_on: [internal]
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    mem_limit: 64m
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
  job:
    image: tt-watcher-api
    command: ["java", "-cp", "out", "com.riftbound.api.JobMain"]
    mem_limit: 256m
    env_file: [.env]
    environment:
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx160m -XX:+UseSerialGC"
      INTERNAL_BASE_URL: http://internal:8081
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal}
      RIFTBOUND_STORE: /app/data/store.json
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes: ["./data:/app/data"]
    depends_on: [internal, api]
    profiles: ["job"]
volumes:
  caddy_data:
  caddy_config:
